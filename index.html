let invType="todos", invQ="", invPage=0;
const profit=p=>p.price-(p.cost||0);
const markup=p=>p.cost>0?Math.round(profit(p)/p.cost*100):null;
function renderInventory(){
  const prods=db.parts;
  const vCost=prods.reduce((a,p)=>a+(p.cost||0)*p.stock,0), vSale=prods.reduce((a,p)=>a+p.price*p.stock,0);
  app.innerHTML=`
    <div class="row" style="margin-bottom:1rem"><h1 style="margin:0">Inventario</h1><span class="spacer"></span>${isAdmin?`<button class="btn primary" id="newProd">Agregar producto</button>`:`<button class="btn primary" id="newProdTech">Agregar mercancía</button>`}</div>
    ${isAdmin?`<div class="cards">
        <div class="card"><span class="stockline">Invertido en inventario</span><span class="num">${money(vCost)}</span></div>
        <div class="card"><span class="stockline">Vale a precio de venta</span><span class="num">${money(vSale)}</span></div>
        <div class="card total"><span class="stockline">Ganancia si vendes todo</span><span class="num">${money(vSale-vCost)}</span></div></div>`
      :""}
    ${isAdmin?pricePendingHTML():""}
    ${stockoutHTML()}
    <div class="row" style="margin-bottom:.8rem"><input class="search" id="inv-q" type="search" placeholder="Busca por nombre, proveedor o código de barras" value="${esc(invQ)}" autocomplete="off"><button class="btn" id="invScan">Escanear con cámara</button></div>
    <div class="filters">${[["todos","Todos"],["pieza","Piezas"],["accesorio","Accesorios"],["servicio","Servicios"]].map(([id,n])=>`<button data-t="${id}" aria-pressed="${invType===id}">${n}</button>`).join("")}</div>
    <div class="tablewrap"><table><thead><tr><th>Producto</th><th>Tipo</th>${isAdmin?`<th style="text-align:right">Costo</th>`:""}<th style="text-align:right">Precio</th>${isAdmin?`<th style="text-align:right">Ganancia</th>`:""}<th style="text-align:right">Existencia</th><th style="text-align:right">Apartadas</th><th style="text-align:right">Disponibles</th><th></th></tr></thead><tbody id="invBody"></tbody></table></div><div id="invPager"></div>
`;
  const body=document.getElementById("invBody");
  const paint=()=>{
    const s=invQ.trim().toLowerCase();
    const rows=[];
    if(invType!=="servicio") db.parts.filter(p=>(invType==="todos"||p.type===invType)&&(!s||p.name.toLowerCase().includes(s)||(p.code||"").toLowerCase().includes(s)||(p.provider||"").toLowerCase().includes(s))).forEach(p=>{
      const a=avail(p), m=markup(p);
      rows.push(`<tr class="${a<=0?"outrow":""}">
        <td><div style="font-weight:600">${esc(p.name)}${a<=0?'<span class="outtag">Sin existencia</span>':""}${p.needsPrice?'<span class="outtag" style="background:var(--warn)">Falta precio</span>':""}</div><div class="code">${p.code?esc(p.code):"Sin código"}${p.provider?`, ${esc(p.provider)}`:""}${isAdmin&&p.addedAt?`, compra ${p.addedAt}`:""}</div></td>
        <td><span class="typetag ${p.type}">${TYPES[p.type]}</span></td>
        ${isAdmin?`<td class="n">${money(p.cost||0)}</td>`:""}<td class="n">${money(p.price)}</td>
        ${isAdmin?`<td class="n" style="font-weight:700;color:${profit(p)>0?"var(--ok)":"var(--bad)"}">${money(profit(p))}${m!==null?`<div class="code">${m}%</div>`:""}</td>`:""}
        <td class="n">${p.stock}</td><td class="n ${p.reserved?"reserved":""}">${p.reserved||0}</td><td class="n ${a<=0?"low":a<=2?"reserved":""}">${a}</td>
        <td style="white-space:nowrap">${p.type!=="servicio"?`<button class="btn small" data-rs="${p.id}">Resurtir</button>`:""}${isAdmin?` <button class="btn small" data-edit="${p.id}">Editar</button>`:""}</td></tr>`);
    });
    if(invType==="todos"||invType==="servicio") db.services.filter(x=>!s||x.name.toLowerCase().includes(s)).forEach(x=>rows.push(`<tr>
        <td><div style="font-weight:600">${esc(x.name)}</div></td><td><span class="typetag servicio">Servicio</span></td>
        ${isAdmin?`<td class="n">—</td>`:""}<td class="n">${money(x.price)}</td>${isAdmin?`<td class="n">—</td>`:""}
        <td class="n">—</td><td class="n">—</td><td class="n">—</td>
        ${isAdmin?`<td><button class="btn small" data-svc="${x.id}">Editar</button></td>`:"<td></td>"}</tr>`));
    const pg=pageOf(rows,invPage); invPage=pg.page;
    body.innerHTML=rows.length?pg.items.join(""):`<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:1.5rem">No hay nada que coincida con “${esc(invQ)}”.${isAdmin?" Agrégalo con “Agregar producto”.":""}</td></tr>`;
    body.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));
    body.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>restockProduct(b.dataset.rs));
    body.querySelectorAll("[data-svc]").forEach(b=>b.onclick=()=>editProduct(b.dataset.svc,true));
    const pgEl=document.getElementById("invPager"); pgEl.innerHTML=pagerHTML(pg); bindPager(pgEl,p=>{invPage=p;paint();});
  };
  paint();
  const nt=document.getElementById("newProdTech"); if(nt) nt.onclick=techAddProduct;
  app.querySelectorAll("[data-np]").forEach(b=>b.onclick=()=>editProduct(b.dataset.np));
  const q=document.getElementById("inv-q");
  q.oninput=()=>{invQ=q.value;invPage=0;paint();};
  app.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{invQ=b.dataset.out;q.value=invQ;invType="todos";invPage=0;app.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.t==="todos"));paint();});
  q.onkeydown=e=>{if(e.key!=="Enter")return;const p=findByCode(q.value);if(p){if(isAdmin)editProduct(p.id);else restockProduct(p.id);}else if(q.value.trim()&&!body.querySelector("[data-edit],[data-svc]")&&!matchProducts(q.value,"todos").length)toast("No hay ningún producto con ese código");};
  document.getElementById("invScan").onclick=()=>scanBarcode(code=>{invQ=code;q.value=code;paint();const p=findByCode(code);if(!p)toast(`El código ${code} no está registrado`);else if(isAdmin)editProduct(p.id); else restockProduct(p.id);});
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{invType=b.dataset.t;invPage=0;app.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b));paint();});
  if(isAdmin){
    document.getElementById("newProd").onclick=()=>editProduct(null);

  }
}

function editProduct(id,isService){
  if(!isAdmin)return;
  const p=id?(isService?db.services.find(x=>x.id===id):db.parts.find(x=>x.id===id)):{type:"pieza",name:"",code:"",provider:"",cost:"",price:"",stock:1,reserved:0};
  if(!p)return;
  const type0=isService?"servicio":p.type;
  const opt=(v,n)=>`<option value="${v}" ${type0===v?"selected":""} ${id&&((v==="servicio")!==!!isService)?"disabled":""}>${n}</option>`;
  const d=modal(`<div class="dhead"><b>${id?"Editar":"Agregar producto"}</b><span class="spacer"></span><button class="btn small" data-close>Cancelar</button></div>
    <div class="dbody"><div class="grid">
      <label>Tipo<select class="field" id="e-type">${opt("pieza","Pieza para reparación")}${opt("accesorio","Accesorio para vender")}${opt("servicio","Servicio")}</select></label>
      <label>Nombre<input class="field" id="e-name" value="${esc(p.name)}"></label>
    </div>
    <div class="prodonly">
      <label style="margin-top:.9rem" for="e-code">Código de barras <span class="hint">(escanéalo con el lector o la cámara)</span></label>
      <div class="row" style="margin-top:.3rem"><input class="field" id="e-code" value="${esc(p.code||"")}" autocomplete="off" style="flex:1;min-width:180px;margin:0"><button class="btn" id="e-scan">Cámara</button></div>
      <label style="margin-top:.9rem">Proveedor <span class="hint">(opcional)</span><input class="field" id="e-prov" value="${esc(p.provider||"")}" list="provs"></label>
      <datalist id="provs">${[...new Set(db.parts.map(x=>x.provider).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join("")}</datalist>
    </div>
    <div class="grid" style="margin-top:.9rem">
      <label class="prodonly">Precio de compra<input class="field" id="e-cost" type="number" min="0" inputmode="decimal" value="${p.cost??""}"></label>
      <label>Precio de venta<input class="field" id="e-price" type="number" min="0" inputmode="decimal" value="${p.price}"></label>
      <label class="prodonly">Existencia<input class="field" id="e-stock" type="number" min="0" inputmode="numeric" value="${p.stock??0}"></label>
      <label class="prodonly">Fecha de compra<input class="field" id="e-date" type="date" value="${p.addedAt||today()}" max="${today()}"></label>
    </div>
    <p class="stockline prodonly" style="margin:.4rem 0 0">${id?"Si resurtes un producto que estaba en cero, la fecha de compra cambia sola a hoy. Si todavía te quedaban unidades, se conserva la fecha anterior.":"Si es mercancía que ya tenías, cambia la fecha a cuando la compraste."}</p>
    <div class="profitbox prodonly" id="e-profit"></div>
    ${!isService&&p.reserved?`<p class="stockline prodonly">${p.reserved} apartada(s) para tickets abiertos.</p>`:""}
    <p class="stockline svconly" style="margin-top:.8rem">Los servicios no llevan existencia ni código: solo nombre y precio.</p>
    <div class="error" id="e-err" role="alert"></div></div>
    <div class="dfoot">${id?`<button class="btn" id="e-del" style="color:var(--bad)">Eliminar</button>`:""}<span class="spacer"></span><button class="btn primary" id="e-save">${id?"Guardar cambios":"Agregar"}</button></div>`);
  const $=s=>d.querySelector(s), err=$("#e-err"), typeSel=$("#e-type");
  const showType=()=>{const svc=typeSel.value==="servicio";d.querySelectorAll(".prodonly").forEach(e=>e.hidden=svc);d.querySelectorAll(".svconly").forEach(e=>e.hidden=!svc);};
  const showProfit=()=>{
    const c=+$("#e-cost").value, pr=+$("#e-price").value, box=$("#e-profit");
    if($("#e-cost").value===""||$("#e-price").value===""){box.innerHTML=`<span class="stockline">Escribe el precio de compra y el de venta para ver cuánto ganas.</span>`;return;}
    const g=pr-c, pct=c>0?Math.round(g/c*100):null;
    box.innerHTML=g>0?`Ganas <b class="num" style="color:var(--ok)">${money(g)}</b> por cada uno${pct!==null?`, un ${pct}% sobre lo que te costó`:""}.`
      :g===0?`<span style="color:var(--warn)">Lo vendes al mismo precio que te costó: no ganas nada.</span>`
      :`<span style="color:var(--bad)">Lo estás vendiendo ${money(-g)} abajo de lo que te costó.</span>`;
  };
  typeSel.onchange=showType; $("#e-cost").oninput=showProfit; $("#e-price").oninput=showProfit;

    if($("#e-price").value===""||!(price>0)){err.textContent="Escribe un precio de venta mayor a cero.";return;}
    if(type==="servicio"){
      if(id)Object.assign(p,{name,price}); else db.services.push({id:"s"+Date.now(),name,price});

      const code=$("#e-code").value.trim(), provider=$("#e-prov").value.trim(), costRaw=$("#e-cost").value, cost=+costRaw, stock=+$("#e-stock").value;

      if(code&&db.parts.some(x=>x.code===code&&x.id!==id)){err.textContent="Ese código de barras ya lo tiene otro producto.";return;}
      const dateIn=$("#e-date"), orig=p.addedAt||today(), wasZero=(p.stock||0)===0;

      let addedAt=orig;

      Object.assign(p,{type,name,code,provider,cost,price,stock,addedAt,needsPrice:false});
      if(!id){p.id="p"+Date.now();db.parts.push(p);}
    }
    save();d.close();toast(id?"Cambios guardados":type==="servicio"?"Servicio agregado":"Producto agregado");route();
  };
  if(id)twoStep($("#e-del"),"Toca otra vez para eliminar",()=>{

let corteDate="", cortePeriod="dia", cortePage=0;
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fmtDate=d=>{const [y,m,dd]=d.split("-").map(Number);return `${dd} de ${MESES[m-1]}`;};
function periodRange(period,anchor){
  if(period==="semana"){const dow=(new Date(anchor+"T12:00:00").getDay()+6)%7;const from=addDays(anchor,-dow);return {from,to:addDays(from,6)};}
  if(period==="mes"){const [y,m]=anchor.split("-").map(Number);const mm=String(m).padStart(2,"0");return {from:`${y}-${mm}-01`,to:`${y}-${mm}-${String(new Date(y,m,0).getDate()).padStart(2,"0")}`};}
  return {from:anchor,to:anchor};
}
function prevAnchor(period,anchor){
  if(period==="semana") return addDays(anchor,-7);
  if(period==="mes"){const [y,m]=anchor.split("-").map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";}
  return addDays(anchor,-1);
}
const PERIODS={dia:["Día","el día anterior"],semana:["Semana","la semana pasada"],mes:["Mes","el mes pasado"]};
function periodLabel(period,r){
  if(period==="dia") return `${fmtDate(r.from)} de ${r.from.slice(0,4)}`;
  if(period==="semana") return `del ${fmtDate(r.from)} al ${fmtDate(r.to)}`;
  return `${MESES[+r.from.slice(5,7)-1]} de ${r.from.slice(0,4)}`;
}
function movementsFor(from,to){
  const inR=d=>d>=from&&d<=to, m=[];
  db.sales.filter(s=>inR(s.date)).forEach(s=>m.push({date:s.date,time:s.time,kind:"venta",concept:`Venta V${s.folio} (${s.items.reduce((a,i)=>a+i.qty,0)} art.)`,method:s.method,amount:s.total}));
  db.tickets.forEach(t=>(t.payments||[]).forEach(p=>{if(inR(p.date))m.push({date:p.date,time:p.time||"",kind:"reparacion",concept:`Pago reparación #${t.folio}, ${t.name}`,method:p.method,amount:p.amount});}));
  db.orders.filter(o=>o.status!=="convertido").forEach(o=>o.payments.forEach(p=>{if(inR(p.date))m.push({date:p.date,time:p.time||"",kind:"pedido",concept:`${p.amount<0?"Devolución de anticipo":"Pago"} pedido P${o.folio}, ${o.name}`,method:p.method,amount:p.amount});}));
  [...db.cash.history,db.cash.open].filter(Boolean).forEach(s=>(s.expenses||[]).forEach(e=>{if(inR(e.date))m.push({date:e.date,time:e.time,kind:"gasto",concept:`Gasto: ${e.reason} (${e.user})`,method:"Efectivo",amount:-e.amount});}));
  return m.sort((a,b)=>(a.date+" "+(a.time||"")).localeCompare(b.date+" "+(b.time||"")));
}
function corteData(from,to){
  const inR=d=>d&&d>=from&&d<=to, m=movementsFor(from,to), sum=l=>l.reduce((a,x)=>a+x.amount,0);
  const ventas=m.filter(x=>x.kind==="venta"), rep=m.filter(x=>x.kind==="reparacion"), ped=m.filter(x=>x.kind==="pedido"), gas=m.filter(x=>x.kind==="gasto");
  const gainOf=items=>items.reduce((b,i)=>b+(i.price-(i.cost||0))*i.qty,0);
  const gv=db.sales.filter(s=>inR(s.date)).reduce((a,s)=>a+gainOf(s.items),0);
  const delivered=db.tickets.filter(t=>t.status==="entregado"&&inR(t.deliveredAt));
  const gr=delivered.reduce((a,t)=>a+gainOf(t.items||[]),0);
  const odel=db.orders.filter(o=>o.status==="entregado"&&inR(o.deliveredAt));
  const go=odel.reduce((a,o)=>a+gainOf(o.items),0);
  return {m,total:sum(m),by:Object.fromEntries(METHODS.map(k=>[k,sum(m.filter(x=>x.method===k))])),ventas,rep,ped,gas,sg:-sum(gas),sv:sum(ventas),sr:sum(rep),sp:sum(ped),gv,gr,go,g:gv+gr+go,nd:delivered.length,no:odel.length};
}
function cmpHTML(cur,prev,label){
  if(!prev&&!cur) return `<span class="cmp">Sin movimientos, igual que ${label}</span>`;
  if(!prev) return `<span class="cmp">${label[0].toUpperCase()+label.slice(1)} no hubo movimientos</span>`;
  const pct=Math.round((cur-prev)/Math.abs(prev)*100);
  return `<span class="cmp ${pct>=0?"up":"down"}">${pct===0?"Igual que":pct>0?`${pct}% más que`:`${-pct}% menos que`} ${label}</span>`;
}

function migrate(){
  if(db.v2)return;
  db.parts.forEach(p=>{const d=DEFAULT_PRODUCTS.find(x=>x.id===p.id);p.type=p.type||"pieza";if(p.code===undefined)p.code=d?d.code:"";});
  DEFAULT_PRODUCTS.forEach(d=>{if(!db.parts.some(p=>p.id===d.id))db.parts.push({...d});});
  db.sales=db.sales||[]; db.nextSale=db.nextSale||1;
  if(!db.sales.length){const p=db.parts.find(x=>x.id==="a1");if(p&&p.stock>0){p.stock--;db.sales.push({folio:db.nextSale++,date:today(),time:"10:15",method:"Efectivo",received:200,total:p.price,items:[{id:p.id,name:p.name,price:p.price,qty:1}]});}}
  db.v2=true;
}
function migrate3(){
  if(db.v3)return;
  db.tickets.forEach(t=>{
    if(t.items)return;
    const isP=t.kind==="part", src=(isP?db.parts:db.services).find(x=>x.id===t.itemId);
    t.items=t.itemId?[{type:isP?"product":"service",id:t.itemId,name:src?src.name:"—",price:t.price,qty:1,ptype:src&&src.type}]:[];
    t.stockUsed=!!t.partUsed; delete t.kind; delete t.itemId; delete t.partUsed;
  });
  db.v3=true;
}
function migrate4(){
  if(db.v4)return;
  db.parts.forEach(p=>{const d=DEFAULT_PRODUCTS.find(x=>x.id===p.id);if(p.cost===undefined)p.cost=d?d.cost:0;if(p.provider===undefined)p.provider=d?d.provider:"";});
  const costOf=id=>{const p=db.parts.find(x=>x.id===id);return p?p.cost||0:0;};
  db.sales.forEach(s=>s.items.forEach(i=>{if(i.cost===undefined)i.cost=costOf(i.id);}));
  db.tickets.forEach(t=>(t.items||[]).forEach(i=>{if(i.cost===undefined)i.cost=i.type==="product"?costOf(i.id):0;}));
  db.v4=true;
}
function migrate5(){
