<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGR Reparaciones – Sistema de tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#18263A; --muted:#5B6B7F; --line:#CDD5DE;
  --tag:#F2B705; --tag-ink:#2A2000; --navy:#18263A; --navy-ink:#FFFFFF;
  --ok:#1F8A4C; --warn:#C26A00; --bad:#B3261E; --info:#1F5FA8; --violet:#6B3FA0;
  --field:#F6F8FA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1722; --surface:#182334; --ink:#E6ECF3; --muted:#9AA9BB; --line:#2C3A4E;
    --tag:#F2B705; --tag-ink:#2A2000; --navy:#24344B; --navy-ink:#FFFFFF;
    --ok:#4CC27F; --warn:#F0A04B; --bad:#F2766E; --info:#6FA8EA; --violet:#B48CE6;
    --field:#121C2A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#182334; --ink:#E6ECF3; --muted:#9AA9BB; --line:#2C3A4E;
  --navy:#24344B; --ok:#4CC27F; --warn:#F0A04B; --bad:#F2766E; --info:#6FA8EA; --violet:#B48CE6;
  --field:#121C2A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.01em}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.1rem;margin-right:auto}
.brand .chip{background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:.1rem .45rem;font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
nav{display:flex;gap:.25rem}
nav a{color:var(--navy-ink);text-decoration:none;padding:.5rem .85rem;border-radius:6px;opacity:.75;font-weight:600}
nav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12);box-shadow:inset 0 -3px 0 var(--tag)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

main{max-width:1100px;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:1.6rem;margin:0 0 1rem;line-height:1.2}
h2{font-size:1.1rem;margin:0 0 .75rem}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.6rem 1rem;font-weight:600;cursor:pointer}
.btn.primary{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.btn.dark{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.small{padding:.35rem .7rem;font-size:.9rem}

.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1rem}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-size:.92rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:200px;padding:.6rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* Ticket list as repair tags */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem}
.tag{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1rem .9rem 1.4rem;cursor:pointer;text-align:left;width:100%}
.tag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:10px 0 0 10px;background:var(--st)}
.tag .top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.tag .folio{font-size:1.9rem;line-height:1}
.tag .dev{font-weight:600;margin-top:.35rem}
.tag .who,.tag .fail{color:var(--muted);font-size:.93rem}
.tag .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem}
.status{display:inline-block;font-size:.8rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;color:var(--st);border:1px solid var(--st)}
.price{font-weight:700}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:2rem;text-align:center;color:var(--muted)}

/* Forms */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.9rem}
label{display:block;font-weight:600;font-size:.92rem}
label span.hint{font-weight:400;color:var(--muted)}
.field{width:100%;margin-top:.3rem;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--field)}
textarea.field{min-height:80px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:.3rem 0 .6rem}
.seg button{border:0;background:var(--field);padding:.5rem 1rem;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.pricebox{display:flex;align-items:baseline;gap:.5rem;margin-top:.6rem}
.pricebox .num{font-size:2rem}
.stockline{font-size:.9rem;color:var(--muted)}
.photos{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.terms{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;max-height:160px;overflow:auto;font-size:.92rem;color:var(--muted)}
.terms ol{margin:0;padding-left:1.2rem}
.check{display:flex;gap:.6rem;align-items:flex-start;margin:.8rem 0;font-weight:500}
.check input{width:22px;height:22px;margin-top:.1rem}
.sigwrap{position:relative;border:2px dashed var(--line);border-radius:10px;background:#fff;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:180px;border-radius:8px;cursor:crosshair}
.sigwrap .line{position:absolute;left:8%;right:8%;bottom:38px;border-bottom:1px solid #9AA9BB;pointer-events:none}
.sigwrap .x{position:absolute;left:8%;bottom:42px;color:#9AA9BB;font-weight:700;pointer-events:none}
.error{color:var(--bad);font-weight:600;margin-top:.5rem}

/* Inventory */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:.7rem .9rem;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.low{color:var(--bad);font-weight:700}
.reserved{color:var(--warn);font-weight:700}

/* Detail dialog */
dialog{border:0;border-radius:14px;padding:0;max-width:720px;width:calc(100% - 2rem);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,18,30,.55)}
.dhead{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.dhead .num{font-size:2.2rem;line-height:1}
.dbody{padding:1.25rem;max-height:70vh;overflow:auto}
.kv{display:grid;grid-template-columns:140px 1fr;gap:.35rem .9rem;margin-bottom:1rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.steps{display:flex;gap:.3rem;flex-wrap:wrap;margin:.5rem 0 1rem}
.steps button{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:.4rem .7rem;cursor:pointer;font-size:.9rem}
.steps button[aria-pressed="true"]{background:var(--st);color:#fff;border-color:var(--st)}
.dfoot{display:flex;gap:.5rem;flex-wrap:wrap;padding:1rem 1.25rem;border-top:1px solid var(--line)}
.sigimg{background:#fff;border:1px solid var(--line);border-radius:8px;max-width:260px}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* Patrón de desbloqueo */
.patbox{--pat-dot:var(--tag);--pat-num:var(--tag-ink);--pat-line:var(--tag);color:var(--ink)}
.patbox svg#pat{display:block;width:min(280px,100%);height:auto;touch-action:none;background:var(--field);border:1px solid var(--line);border-radius:12px;cursor:pointer;user-select:none}
#cam{max-width:760px}
.paysum{display:flex;gap:1.75rem;margin-top:.9rem;flex-wrap:wrap}
.paysum div{display:flex;flex-direction:column}
.paysum .num{font-size:1.7rem;line-height:1.1}
.paytag{font-size:.86rem;font-weight:600;margin-top:.3rem}
.paylist{list-style:none;padding:0;margin:0 0 .8rem}
.paylist li{display:flex;gap:.75rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.paylist li b{margin-left:auto}
.pb{break-after:page;page-break-after:always}

/* Inventario, caja y corte */
.adminbtn{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--navy-ink);border-radius:999px;padding:.4rem .9rem;font-weight:600;cursor:pointer;font-size:.9rem}
.adminbtn[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--info);border-radius:8px;padding:.7rem 1rem;margin-bottom:1rem;color:var(--muted)}
.code{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.typetag{font-size:.8rem;font-weight:600;padding:.1rem .55rem;border-radius:999px;border:1px solid currentColor}
.typetag.pieza{color:var(--info)}.typetag.accesorio{color:var(--violet)}
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem;align-items:start}
.paypanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:820px){.pos{grid-template-columns:1fr}.paypanel{position:static}}
.results{display:flex;flex-direction:column;gap:.35rem;margin-top:.6rem}
.result{display:flex;align-items:center;gap:.75rem;padding:.55rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer;text-align:left;width:100%}
.result:disabled{opacity:.5;cursor:not-allowed}
.result .r-name{font-weight:600}.result .r-price{margin-left:auto;font-weight:700}
table.cart{min-width:0}
.pickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem}
.picker{border:1px solid var(--line);border-radius:10px;background:var(--field);padding:.75rem;display:flex;flex-direction:column;min-width:0}
.picker h3{margin:0 0 .5rem;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.picker h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--dot)}
.picker .search{min-width:0;padding:.5rem .65rem;background:var(--surface)}
.plist{margin-top:.5rem;max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:.3rem}
.pitem{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.45rem .6rem;cursor:pointer}
.pitem:disabled{opacity:.45;cursor:not-allowed}
.pitem .pi-text{display:flex;flex-direction:column;min-width:0;flex:1}
.pitem .r-name{font-weight:600;font-size:.95rem}
.pitem .r-price{font-weight:700;white-space:nowrap}
.pitem .plus{width:26px;height:26px;border-radius:50%;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;font-weight:700;flex:none}
.listtitle{font-size:1rem;margin:1.1rem 0 .5rem}
.typetag.servicio{color:var(--ok)}
.profitbox{margin-top:.8rem;padding:.7rem .9rem;border-radius:8px;background:var(--field);border:1px solid var(--line)}
.profitbox .num{font-size:1.3rem}
.card.gain{background:var(--ok);color:#fff;border-color:var(--ok)}
.card.gain .stockline{color:rgba(255,255,255,.85)}
.cart.mini td{padding:.25rem .3rem;border-bottom:1px solid var(--line)}.cart td{padding:.55rem .4rem;vertical-align:middle}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--field);width:36px;height:36px;font-size:1.15rem;cursor:pointer}
.qty span{min-width:34px;text-align:center;font-weight:700}
.bigtotal{font-size:3.2rem;line-height:1}
.change{font-size:1.5rem;font-weight:700}
.btn.block{width:100%;padding:.95rem;font-size:1.15rem;margin-top:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem}
.card .num{font-size:1.9rem;line-height:1.15;display:block}
.card.total{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.card.total .stockline{color:rgba(255,255,255,.75)}
.scanview{position:relative;background:#000}
.scanview video{width:100%;display:block;max-height:60vh;object-fit:cover}
.scanframe{position:absolute;left:12%;right:12%;top:33%;bottom:33%;border:3px solid var(--tag);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#modal{max-width:620px}
#modal.wide{max-width:960px}
body.locked nav,body.locked #userBtn{display:none}
.homeacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem;margin-bottom:1.3rem}
.bigact{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;padding:1.1rem 1.25rem;border-radius:12px;text-decoration:none;font-weight:700;font-size:1.3rem}
.bigact span{font-weight:500;font-size:.92rem;opacity:.8}
.bigact.ticket{background:var(--tag);color:var(--tag-ink)}
.bigact.sale{background:var(--navy);color:var(--navy-ink)}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.65rem 1.1rem;font-weight:700;font-size:1.02rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tag)}
.pager{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.pager .pg{min-width:40px}
.pager .pg[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.salerow{cursor:pointer}
.salerow:hover td,.salerow:focus-visible td{background:var(--field)}
.timeline{list-style:none;margin:0 0 .8rem .4rem;padding:0;border-left:3px solid var(--line)}
.timeline li{position:relative;padding:.3rem 0 .75rem 1rem}
.timeline li::before{content:"";position:absolute;left:-8px;top:.6rem;width:13px;height:13px;border-radius:50%;background:var(--tag);border:2px solid var(--surface)}
.timeline li.sys::before{background:var(--line)}
.timeline .meta{font-size:.82rem;color:var(--muted)}
.timeline li.sys .txt{color:var(--muted)}
.login{max-width:440px;margin:2.5rem auto}
.userpick{display:flex;flex-direction:column;gap:.4rem;margin:.6rem 0 1rem}
.userpick button{display:flex;justify-content:space-between;align-items:center;padding:.75rem .95rem;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer;font-weight:600;font-size:1.05rem}
.userpick button[aria-pressed="true"]{border-color:var(--tag);box-shadow:inset 0 0 0 2px var(--tag)}
.upper{text-transform:uppercase}
:root{--wait:#A23E8C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wait:#E58BD0}}
:root[data-theme="dark"]{--wait:#E58BD0}
.pendtag{font-size:.72rem;font-weight:700;color:#fff;background:var(--wait);border-radius:999px;padding:.05rem .45rem;vertical-align:middle;white-space:nowrap}
.notice.pend{border-left-color:var(--wait);color:var(--ink)}
.notice.alert{border-left-color:var(--bad);color:var(--ink)}
.intake{margin-top:.9rem;padding:.75rem .9rem;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.marks{display:flex;flex-wrap:wrap;gap:.4rem}
.mark{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .75rem;font-weight:500;cursor:pointer}
.mark input{width:18px;height:18px;margin:0}
.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.checkrow{display:flex;align-items:center;gap:.6rem;padding:.45rem .7rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.checkrow:last-child{border-bottom:0}
.checkrow>span:first-child{flex:1;min-width:130px;font-weight:600}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tri button{border:0;background:var(--field);padding:.35rem .6rem;font-size:.85rem;cursor:pointer;font-weight:600;color:var(--muted)}
.tri button+button{border-left:1px solid var(--line)}
.tri button[aria-pressed="true"].ok{background:var(--ok);color:#fff}
.tri button[aria-pressed="true"].falla{background:var(--bad);color:#fff}
.tri button[aria-pressed="true"].np{background:var(--muted);color:#fff}
.tri button:disabled{cursor:default}
.label60{width:60mm;height:40mm;padding:2mm;display:flex;gap:2mm;font-family:"Barlow",sans-serif;font-size:8.5pt;line-height:1.2;color:#000;background:#fff;overflow:hidden;box-sizing:border-box}
.label60 .lcol{width:19mm;flex:none;display:flex;flex-direction:column;gap:1mm;align-items:center}
.label60 .lcol svg{width:18mm;height:18mm;display:block}
.label60 .lpat svg{width:15mm;height:15mm}
.label60 .rcol{flex:1;min-width:0;overflow:hidden}
.label60 .lfolio{font-family:"Barlow Condensed",sans-serif;font-size:17pt;font-weight:700;line-height:1}
.label60 .lmodel{font-weight:700}
.label60 .lfault{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.5mm}
.label60 .llock{font-weight:700;margin-top:.5mm;word-break:break-all}

.btn.wa{background:#1F8A4C;color:#fff;border-color:#1F8A4C;text-decoration:none;display:inline-block}
.notice.wa{border-left-color:#1F8A4C;color:var(--ink)}
.notice.wa .btn.wa{margin-left:.4rem}
.cmp{display:block;font-size:.84rem;font-weight:600;margin-top:.25rem;opacity:.9}
.cmp.up{color:var(--ok)}.cmp.down{color:var(--bad)}
.card.total .cmp{color:rgba(255,255,255,.8)}.card.total .cmp.up{color:#8FE3B0}.card.total .cmp.down{color:#FFB4AE}
.card.gain .cmp,.card.gain .cmp.up,.card.gain .cmp.down{color:#fff}
.qr{display:flex;justify-content:center;margin:2mm 0 0}
.qr svg{width:24mm;height:24mm}
.switch{display:flex;align-items:flex-start;gap:.9rem;padding:.75rem 0;border-bottom:1px solid var(--line);cursor:pointer;font-weight:400}
.switch:last-child{border-bottom:0}
.switch input[type=checkbox]{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.switch input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input[type=checkbox]:checked{background:var(--ok)}
.switch input[type=checkbox]:checked::after{left:23px}
@media (prefers-reduced-motion:reduce){.switch input,.switch input::after{transition:none}}

.notadmin [data-admin]{display:none}
.notice.cashoff{border-left-color:var(--bad);color:var(--ink)}
.notice.stockout{border-left-color:var(--bad);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.chip{border:1px solid var(--bad);color:var(--bad);background:var(--surface);border-radius:999px;padding:.2rem .7rem;font-size:.86rem;cursor:pointer;font-weight:600}
tr.outrow td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.outtag{font-size:.74rem;color:#fff;background:var(--bad);border-radius:999px;padding:.05rem .45rem;margin-left:.35rem;vertical-align:middle;font-weight:700}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.cashbox.on{border-left:5px solid var(--ok)}
.cashbox.off{border-left:5px solid var(--bad)}
.bars{display:flex;flex-direction:column;gap:.45rem}
.bar{display:grid;grid-template-columns:minmax(110px,190px) 1fr 2.5rem;align-items:center;gap:.6rem}
.bar .bl{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{background:var(--field);border-radius:6px;height:18px;overflow:hidden;border:1px solid var(--line)}
.bar .bt span{display:block;height:100%;background:var(--info)}
.bar b{text-align:right}
.bigact.order{background:var(--violet);color:#fff}
.kindtag{font-size:.74rem;font-weight:700}
.kindtag.ticket{color:var(--info)}.kindtag.venta{color:var(--ok)}.kindtag.pedido{color:var(--violet)}
.pending{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--violet);border-radius:10px;padding:.85rem 1rem;margin-bottom:1.2rem}
.pending .pitem .status{white-space:nowrap}
details.custom{margin-top:.9rem;border:1px dashed var(--line);border-radius:8px;padding:.6rem .8rem}
details.custom summary{cursor:pointer;font-weight:600;color:var(--info)}
.notephotos{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.notephotos img{width:68px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.photos img{cursor:zoom-in}
.thumbx{position:relative;display:inline-block}
.thumbx button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-weight:700;line-height:1}
#lightbox{background:#000;padding:0;border:0;border-radius:10px;max-width:96vw;max-height:94vh;overflow:hidden}
#lightbox::backdrop{background:rgba(0,0,0,.85)}
#lightbox img{display:block;max-width:96vw;max-height:84vh;object-fit:contain;margin:0 auto}
#lightbox .lbbar{display:flex;justify-content:flex-end;padding:.5rem}

/* Print */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;color:#000;background:#fff}
  header,body::before{display:none}
}
.receipt{width:76mm;padding:4mm;font-size:11px;line-height:1.35;font-family:"Barlow",sans-serif}
.receipt h3{margin:0;font-size:15px;text-align:center}
.receipt .c{text-align:center}
.receipt .big{font-family:"Barlow Condensed",sans-serif;font-size:26px;text-align:center;margin:2mm 0}
.receipt hr{border:0;border-top:1px dashed #000;margin:2mm 0}
.receipt img{max-width:100%;height:40px;object-fit:contain}
.label{width:50mm;height:25mm;border:1px solid #000;padding:1.5mm 2mm;font-size:8.5px;line-height:1.25;overflow:hidden}
.label .big{font-family:"Barlow Condensed",sans-serif;font-size:18px;line-height:1}

const paid=t=>(t.payments||[]).reduce((a,p)=>a+p.amount,0);
const balance=t=>Math.max(0,(t.price||0)-paid(t));
function payText(t){const p=paid(t);if(!(t.price>0)&&p<=0)return "Sin costo";if(p<=0)return "Sin pago";if(balance(t)<=0)return "Pagado";return `Anticipo ${money(p)} · resta ${money(balance(t))}`;}
function payColor(t){const p=paid(t);if(!(t.price>0))return "var(--ok)";return p<=0?"var(--bad)":balance(t)<=0?"var(--ok)":"var(--warn)";}

const LOCKS={none:"Sin bloqueo",pattern:"Patrón",pin:"PIN",password:"Contraseña"};
const PT=i=>[50+((i-1)%3)*100,50+Math.floor((i-1)/3)*100];
function patternInner(seq){
  let s="";
  if(seq.length>1) s+=`<polyline points="${seq.map(n=>PT(n).join(",")).join(" ")}" fill="none" style="stroke:var(--pat-line,currentColor)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`;
  for(let i=1;i<=9;i++){const [x,y]=PT(i);const k=seq.indexOf(i);
    s+= k>=0
      ? `<circle cx="${x}" cy="${y}" r="28" style="fill:var(--pat-dot,currentColor)"/><text x="${x}" y="${y}" dy=".35em" text-anchor="middle" font-size="28" font-weight="700" font-family="Barlow Condensed,sans-serif" style="fill:var(--pat-num,#fff)">${k+1}</text>`
      : `<circle cx="${x}" cy="${y}" r="24" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><circle cx="${x}" cy="${y}" r="7" fill="currentColor" opacity=".55"/>`;
  }
  return s;
}
function patternSVG(seq,size){return `<svg viewBox="0 0 300 300" width="${size}" height="${size}" role="img" aria-label="Patrón ${seq.join("-")}">${patternInner(seq)}</svg>`;}
function lockLine(t){
  if(!t.lockType||t.lockType==="none") return "Sin bloqueo";
  if(t.lockType==="pattern") return "Patrón: "+t.lockValue.split("-").join(" → ");
  return LOCKS[t.lockType]+": <b>"+esc(t.lockValue)+"</b>";
}
function lockHTML(t,size){return lockLine(t)+(t.lockType==="pattern"?`<div style="margin-top:.4rem">${patternSVG(t.lockValue.split("-").map(Number),size)}</div>`:"");}

async function openCamera(onShot,fallback){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallback();return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});}
  catch(e){toast("No se pudo abrir la cámara. Revisa el permiso del navegador.");fallback();return;}
  const dlg=document.getElementById("cam"); let n=0;
  dlg.innerHTML=`<div class="dhead"><b>Tomar foto del equipo</b><span class="spacer"></span><button class="btn small" id="camClose">Listo</button></div>
    <video id="camV" autoplay playsinline muted style="width:100%;display:block;max-height:65vh;background:#000"></video>
    <div class="dfoot"><span class="stockline" id="camCount">Sin fotos todavía</span><span class="spacer"></span><button class="btn primary" id="camShot">Capturar foto</button></div>`;
  const v=dlg.querySelector("#camV"); v.srcObject=stream;
  dlg.querySelector("#camShot").onclick=()=>{
    if(!v.videoWidth) return;
    const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
    onShot(c.toDataURL("image/jpeg",.8)); n++;
    dlg.querySelector("#camCount").textContent=n+(n===1?" foto tomada":" fotos tomadas");
  };
  dlg.querySelector("#camClose").onclick=()=>dlg.close();
  dlg.onclose=()=>stream.getTracks().forEach(tr=>tr.stop());
  dlg.showModal();
}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------- Router ---------- */
function route(){
  let v=(location.hash||"#inicio").slice(1); if(!v||v==="tickets") v="inicio";
  document.body.classList.toggle("locked",!currentUser);
  if(!currentUser){ renderLogin(); window.scrollTo(0,0); return; }
  document.body.classList.toggle("notadmin",!isAdmin);
  if((v==="corte"||v==="reportes"||v==="panel")&&!isAdmin) v="inicio";
  const navKey=(v==="nuevo"||v==="venta"||v==="pedido")?"inicio":v;
  document.querySelectorAll("nav a").forEach(a=>{ if(a.getAttribute("href")!=="#"+navKey) a.removeAttribute("aria-current"); else a.setAttribute("aria-current","page"); });
  if(v==="nuevo") renderNew(); else if(v==="inventario") renderInventory(); else if(v==="venta") renderCaja(); else if(v==="corte") renderCorte(); else if(v==="reportes") renderReports(); else if(v==="panel") renderPanel(); else if(v==="pedido") renderOrderForm(); else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- Fotos ---------- */
function shrinkImage(src,max=1280){
  return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);try{res(c.toDataURL("image/jpeg",.78));}catch(e){res(src);}};img.onerror=()=>res(src);img.src=src;});
}
function openPhoto(src){
  const d=document.getElementById("lightbox");
  d.innerHTML=`<div class="lbbar"><button class="btn small" id="lbClose">Cerrar</button></div><img src="${src}" alt="Foto en grande">`;
  d.querySelector("#lbClose").onclick=()=>d.close();
  d.onclick=e=>{if(e.target===d)d.close();};
  d.showModal();
}
function bindZoom(root){root.querySelectorAll("[data-zoom]").forEach(img=>img.onclick=()=>openPhoto(img.src));}

}
function removeItem(t,k){
  const i=t.items[k]; if(!i)return;
  if(i.type==="product"&&!i.pending){const p=db.parts.find(x=>x.id===i.id);if(p)p.reserved=Math.max(0,p.reserved-1);}
  i.qty--; if(i.qty<=0)t.items.splice(k,1);
  t.price=t.items.reduce((a,x)=>a+x.price*x.qty,0);
  logEvent(t,`Quitó ${i.name} (${money(i.price)})`);
  save(); toast(`Se quitó ${i.name}`); openDetail(t.folio); renderTickets();
}

function saveOrder(){
  const v=id=>document.getElementById(id).value.trim(), err=document.getElementById("err"), missing=[];
  if(!v("o-name"))missing.push("nombre"); if(!v("o-phone"))missing.push("teléfono");
  if(!v("o-brand"))missing.push("marca"); if(!v("o-model"))missing.push("modelo");
  if(!odraft.items.length)missing.push("la pieza que se va a pedir");
  if(!document.getElementById("f-accept").checked)missing.push("aceptación de términos");
  if(!odraft.signed)missing.push("firma del cliente");
  if(missing.length){err.textContent="Falta: "+missing.join(", ")+".";return;}
  const adv=+v("o-adv")||0;
  if(adv>0&&!cashOpen()){err.textContent="La caja está cerrada: no se puede recibir anticipo.";return;}
  if(adv<0||adv>odraft.price){err.textContent="El anticipo no puede ser mayor que el total.";return;}
  const o={folio:db.nextOrder++,date:today(),time:nowTime(),name:v("o-name").toUpperCase(),phone:v("o-phone"),brand:v("o-brand").toUpperCase(),model:v("o-model").toUpperCase(),color:v("o-color"),fault:v("o-fault"),
    items:odraft.items.map(i=>({...i})),price:odraft.price,provider:v("o-prov"),eta:v("o-eta"),status:"por_pedir",signature:sigCanvas.toDataURL("image/png"),
    payments:adv>0?[{amount:adv,method:v("o-met"),...stamp()}]:[],createdBy:currentUser.name,
    log:[{kind:"sistema",text:"Pedido creado"+(adv>0?` con anticipo de ${money(adv)}`:""),date:today(),time:nowTime(),user:currentUser.name}]};
  if(adv>0) notify("cobros",`${currentUser.name} recibió ${money(adv)} de anticipo del pedido P${o.folio}`);
  db.orders.push(o); save();
  toast(`Pedido P${o.folio} guardado. Imprimiendo comprobante…`);
  location.hash="inicio"; setTimeout(()=>{openOrderDetail(o.folio);printOrder(o);},80);
}
function setOrderStatus(o,to){
  if(o.status===to)return;
  const prods=o.items.filter(i=>i.type==="product").map(i=>[db.parts.find(p=>p.id===i.id),i.qty]).filter(([p])=>p);
  if(o.status==="llego") prods.forEach(([p,q])=>{p.stock=Math.max(0,p.stock-q);p.reserved=Math.max(0,p.reserved-q);});
  if(to==="llego") prods.forEach(([p,q])=>{p.stock+=q;p.reserved+=q;});
  o.status=to; logEvent(o,`Cambió el estado a ${ordSt(to).name}`); save();
  toast(to==="llego"?`Llegó la pieza. Avisa a ${o.name}.`:`P${o.folio}: ${ordSt(to).name}`);
}
function cancelOrder(o){
  const prods=o.items.filter(i=>i.type==="product").map(i=>[db.parts.find(p=>p.id===i.id),i.qty]).filter(([p])=>p);
  if(o.status==="llego") prods.forEach(([p,q])=>{p.reserved=Math.max(0,p.reserved-q);});
  if(o.status==="por_pedir"&&paid(o)>0){const amt=paid(o);o.payments.push({amount:-amt,method:o.payments[0].method,...stamp()});logEvent(o,`Devolvió el anticipo de ${money(amt)}`);}

}
function deliverOrder(o,method){

/* ---------- Fechas y garantías ---------- */
function addDays(d,n){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);}
const warrantyDays=t=>t.tampered?5:15;
function warrantyInfo(t){
  if(t.status!=="entregado"||!t.deliveredAt) return null;
  const until=addDays(t.deliveredAt,warrantyDays(t)), left=daysBetween(today(),until);
  return {until,left,active:left>=0};
}
function warrantyHTML(t){
  const w=warrantyInfo(t);
  const base=t.tampered?"Equipo manipulado previamente: 5 días":"Equipo sin manipular: 15 días";
  const st=!w?`<div class="stockline">Empieza a contar cuando se entrega el equipo.</div>`
    :w.active?`<div style="color:var(--ok);font-weight:700">Vigente hasta ${w.until} (${w.left===0?"vence hoy":w.left===1?"queda 1 día":`quedan ${w.left} días`})</div>`
    :`<div style="color:var(--bad);font-weight:700">Venció el ${w.until}</div>`;

function cashClosedNote(){return `<div class="notice cashoff">La caja está cerrada, así que no se puede cobrar. ${isAdmin?`Ábrela en <a href="#corte">Corte</a>.`:"Pide al administrador que la abra."}</div>`;}

const stamp=()=>({date:today(),time:nowTime(),user:currentUser?currentUser.name:"—",cashId:cashOpen()?db.cash.open.id:null});
function cashSessionData(s){
  const pays=[];
  db.tickets.forEach(t=>(t.payments||[]).forEach(p=>{if(p.cashId===s.id)pays.push(p);}));
  db.orders.filter(o=>o.status!=="convertido").forEach(o=>o.payments.forEach(p=>{if(p.cashId===s.id)pays.push(p);}));
  db.sales.forEach(x=>{if(x.cashId===s.id)pays.push({amount:x.total,method:x.method});});
  const by=Object.fromEntries(METHODS.map(k=>[k,pays.filter(p=>p.method===k).reduce((a,p)=>a+p.amount,0)]));
  const exp=(s.expenses||[]).reduce((a,e)=>a+e.amount,0);
  return {by,exp,expected:s.initial+by.Efectivo-exp};
}
const diffText=d=>d===0?"cuadró exacto":d>0?`sobraron ${money(d)}`:`faltaron ${money(-d)}`;
function historyHTML(){
  const hs=db.cash.history.slice(-8).reverse(); if(!hs.length) return "";

    ${hs.map(s=>`<tr><td>${s.date} ${s.time}<div class="code">${esc(s.openedBy)}</div></td><td>${s.closedDate} ${s.closedTime}<div class="code">${esc(s.closedBy)}</div></td><td class="n">${money(s.expected)}</td><td class="n">${money(s.counted)}</td><td class="n" style="font-weight:700;color:${s.diff===0?"var(--ok)":s.diff>0?"var(--warn)":"var(--bad)"}">${s.diff===0?"Exacto":(s.diff>0?"+":"−")+money(Math.abs(s.diff))}</td></tr>`).join("")}</tbody></table></div></details>`;
}

  const op=document.getElementById("cx-open");

    notify("cierre",`${currentUser.name} abrió la caja con ${money(+v)}`);

  };

  if(ex) ex.onclick=()=>{

      const a=+d.querySelector("#ge-amt").value, why=d.querySelector("#ge-why").value.trim(), err=d.querySelector("#ge-err");
      if(!(a>0)){err.textContent="Escribe una cantidad mayor a cero.";return;}
      if(!why){err.textContent="Escribe el motivo del gasto.";return;}
      db.cash.open.expenses.push({amount:a,reason:why,user:currentUser.name,date:today(),time:nowTime()}); notify("gastos",`${currentUser.name} sacó ${money(a)} de la caja: ${why}`);
      save(); d.close(); toast(`Gasto de ${money(a)} registrado`); renderCorte();
    };
  };

      <div class="dbody"><p style="margin-top:0">Según el sistema debe haber <b class="num" style="font-size:1.3rem">${money(data.expected)}</b> en efectivo.</p>

      <p id="cc-diff" style="font-weight:700;min-height:1.5em"></p>
      <p class="stockline">Al cerrar ya no se podrá cobrar hasta que vuelvas a abrir la caja.</p></div>
      <div class="dfoot"><span class="spacer"></span><button class="btn dark" id="cc-ok">Cerrar caja</button></div>`);
    const inp=d.querySelector("#cc-count"), out=d.querySelector("#cc-diff"); inp.focus();
    inp.oninput=()=>{if(inp.value===""){out.textContent="";return;}const df=+inp.value-data.expected;out.textContent=df===0?"Cuadra exacto.":df>0?`Sobran ${money(df)}.`:`Faltan ${money(-df)}.`;out.style.color=df===0?"var(--ok)":df>0?"var(--warn)":"var(--bad)";};
    d.querySelector("#cc-ok").onclick=()=>{

      db.cash.history.push(s); db.cash.open=null; save(); d.close();

    };
  };
}

let repDays=30;
function renderReports(){
  const from=repDays?addDays(today(),-(repDays-1)):"0000-00-00", inP=d=>d>=from;
  const tks=db.tickets.filter(t=>t.status!=="cancelado"&&inP(t.date)), sls=db.sales.filter(s=>inP(s.date));
  const agg={};
  const addI=i=>{const k=(i.type==="service"?"s:":"p:")+(i.type==="custom"?i.name:i.id);const a=agg[k]||(agg[k]={name:i.name,type:i.type==="service"?"Servicio":i.type==="custom"?"Pieza fuera de inventario":(TYPES[i.ptype]||"Pieza"),qty:0,rev:0,gain:0});a.qty+=i.qty;a.rev+=i.price*i.qty;a.gain+=(i.price-(i.cost||0))*i.qty;};
  tks.forEach(t=>(t.items||[]).forEach(addI));
  sls.forEach(s=>s.items.forEach(i=>addI({...i,type:"product",ptype:(db.parts.find(p=>p.id===i.id)||{}).type||"accesorio"})));
  const all=Object.values(agg), top=all.slice().sort((a,b)=>b.qty-a.qty||b.rev-a.rev).slice(0,10);
  const income=tks.reduce((a,t)=>a+t.price,0)+sls.reduce((a,s)=>a+s.total,0), gain=all.reduce((a,x)=>a+x.gain,0);
  const mods={}; tks.forEach(t=>{const k=`${t.brand} ${t.model}`.trim();mods[k]=(mods[k]||0)+1;});
  const topM=Object.entries(mods).sort((a,b)=>b[1]-a[1]).slice(0,10), maxM=topM.length?topM[0][1]:1;
  const lastUse={}, mark=(id,d)=>{if(id&&(!lastUse[id]||d>lastUse[id]))lastUse[id]=d;};
  db.tickets.filter(t=>t.status!=="cancelado").forEach(t=>(t.items||[]).forEach(i=>{if(i.type==="product")mark(i.id,t.deliveredAt||t.date);}));
  db.sales.forEach(s=>s.items.forEach(i=>mark(i.id,s.date)));
  const stale=db.parts.filter(p=>p.stock>0).map(p=>{const ref=[p.addedAt||"2000-01-01",lastUse[p.id]||""].sort().pop();return {p,days:daysBetween(ref,today()),money:(p.cost||0)*p.stock,last:lastUse[p.id]};}).filter(x=>x.days>=60).sort((a,b)=>b.days-a.days);
  const staleMoney=stale.reduce((a,x)=>a+x.money,0);
  const wt=db.tickets.filter(t=>t.warrantyOf!=null).sort((a,b)=>b.folio-a.folio).map(t=>{const o=db.tickets.find(x=>x.folio===t.warrantyOf);const tech=o?(((o.log||[]).filter(e=>/Listo para entregar|En reparación/.test(e.text)).pop()||{}).user||o.createdBy):"—";return {t,o,tech};});
  const periods=[[7,"7 días"],[30,"30 días"],[90,"90 días"],[0,"Todo"]];
  app.innerHTML=`<div class="row" style="margin-bottom:1rem"><h1 style="margin:0">Reportes</h1><span class="spacer"></span>
      <div class="filters" style="margin:0">${periods.map(([d,n])=>`<button data-rd="${d}" aria-pressed="${repDays===d}">${n}</button>`).join("")}</div></div>
    <div class="cards">
      <div class="card"><span class="stockline">Reparaciones recibidas</span><span class="num">${tks.length}</span></div>
      <div class="card"><span class="stockline">Ventas de accesorios</span><span class="num">${sls.length}</span></div>
      <div class="card"><span class="stockline">Vendido y cobrado en tickets</span><span class="num">${money(income)}</span></div>
      <div class="card gain"><span class="stockline">Ganancia</span><span class="num">${money(gain)}</span></div></div>
    <section class="sheet"><h2>Lo que más sale</h2>
      ${top.length?`<div class="tablewrap" style="border:0"><table><thead><tr><th>Producto o servicio</th><th>Tipo</th><th style="text-align:right">Veces</th><th style="text-align:right">Ingresos</th><th style="text-align:right">Ganancia</th></tr></thead><tbody>
        ${top.map((x,i)=>`<tr><td><span class="num" style="color:var(--muted);margin-right:.4rem">${i+1}</span>${esc(x.name)}</td><td>${x.type}</td><td class="n">${x.qty}</td><td class="n">${money(x.rev)}</td><td class="n" style="color:var(--ok);font-weight:700">${money(x.gain)}</td></tr>`).join("")}</tbody></table></div>`
        :`<p class="stockline">No hay movimientos en este periodo.</p>`}
    </section>
    <section class="sheet"><h2>Modelos que más llegan</h2>
      ${topM.length?`<div class="bars">${topM.map(([m,n])=>`<div class="bar"><span class="bl">${esc(m)}</span><span class="bt"><span style="width:${Math.max(6,n/maxM*100)}%"></span></span><b>${n}</b></div>`).join("")}</div>`:`<p class="stockline">No llegaron equipos en este periodo.</p>`}
    </section>
    <section class="sheet"><h2>Sin movimiento en 60 días o más</h2>
      <p class="stockline" style="margin-top:-.4rem">Productos que compraste y no se han usado ni vendido. Tienes <b>${money(staleMoney)}</b> detenidos en ellos.</p>
      ${stale.length?`<div class="tablewrap" style="border:0"><table><thead><tr><th>Producto</th><th style="text-align:right">Existencia</th><th style="text-align:right">Días sin moverse</th><th>Último movimiento</th><th style="text-align:right">Dinero detenido</th></tr></thead><tbody>
        ${stale.map(x=>`<tr><td>${esc(x.p.name)}<div class="code">${TYPES[x.p.type]}${x.p.provider?", "+esc(x.p.provider):""}</div></td><td class="n">${x.p.stock}</td><td class="n" style="font-weight:700;color:var(--bad)">${x.days}</td><td>${x.last?`Se usó o vendió el ${x.last}`:`Se compró el ${x.p.addedAt||"—"}, nunca se ha vendido`}</td><td class="n">${money(x.money)}</td></tr>`).join("")}</tbody></table></div>`
        :`<p class="stockline">Todo se está moviendo bien.</p>`}
    </section>
    <section class="sheet"><h2>Garantías</h2>
      ${wt.length?`<div class="tablewrap" style="border:0"><table><thead><tr><th>Ticket de garantía</th><th>Ticket original</th><th>Qué se le había hecho</th><th>Técnico</th></tr></thead><tbody>
        ${wt.map(({t,o,tech})=>`<tr class="salerow" data-wt="${t.folio}" tabindex="0"><td><b>#${t.folio}</b><div class="code">${t.date}, ${esc(t.fault)}</div></td><td>#${t.warrantyOf}<div class="code">${o?esc(o.brand+" "+o.model):""}</div></td><td>${o?esc(itemName(o)):"—"}</td><td>${esc(tech)}</td></tr>`).join("")}</tbody></table></div>`
        :`<p class="stockline">No se ha abierto ninguna garantía.</p>`}
    </section>`;
  app.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{repDays=+b.dataset.rd;renderReports();});
  app.querySelectorAll("[data-wt]").forEach(r=>{const o=()=>openDetail(+r.dataset.wt);r.onclick=o;r.onkeydown=e=>{if(e.key==="Enter")o();};});
}

/* ---------- Código QR de los tickets ---------- */
function qrHTML(code){
  if(!window.qrcode) return `<div class="c" style="font-size:9px">${code}</div>`;
  try{const q=qrcode(0,"M");q.addData(code);q.make();return `<div class="qr">${q.createSvgTag(3,0)}</div><div class="c" style="font-size:9px">${code}</div>`;}
  catch(e){return `<div class="c" style="font-size:9px">${code}</div>`;}
}
function openByCode(code){
  const m=String(code||"").trim().match(/^IGR-([TPV])-(\d+)$/i); if(!m) return false;
  const k=m[1].toUpperCase(), f=+m[2];
  if(k==="T"&&db.tickets.some(t=>t.folio===f)){openDetail(f);return true;}
  if(k==="P"&&db.orders.some(o=>o.folio===f)){openOrderDetail(f);return true;}
  if(k==="V"&&db.sales.some(s=>s.folio===f)){openSale(f);return true;}
  toast("Ese código ya no existe en el sistema"); return true;
}
function scanTicketQR(){scanBarcode(code=>{if(!openByCode(code))toast("Ese código no es de un ticket de "+shop().name);});}

async function getDownloads(){try{return window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){return null;}}
async function offerFile(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".json")?"application/json":"application/octet-stream"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast("Archivo listo");}
  catch(e){toast("No se pudo descargar el archivo");}
}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s);});}
async function exportExcel(){
  let X; try{X=await loadXLSX();}catch(e){toast("No se pudo preparar el archivo de Excel");return;}
  const wb=X.utils.book_new(), add=(name,rows)=>X.utils.book_append_sheet(wb,X.utils.json_to_sheet(rows.length?rows:[{"Sin datos":""}]),name);
  add("Inventario",db.parts.map(p=>({Producto:p.name,Tipo:TYPES[p.type],Código:p.code||"",Proveedor:p.provider||"",Costo:p.cost||0,Precio:p.price,Existencia:p.stock,Apartadas:p.reserved||0,Disponibles:avail(p),"Fecha de compra":p.addedAt||""})));
  add("Servicios",db.services.map(s=>({Servicio:s.name,Precio:s.price})));
  add("Reparaciones",db.tickets.map(t=>({Folio:t.folio,Fecha:t.date,Cliente:t.name,Teléfono:t.phone,Equipo:`${t.brand} ${t.model}`,Estado:stOf(t.status).name,Conceptos:itemName(t),Total:t.price,Pagado:paid(t),Resta:balance(t),Recibió:t.createdBy||"",Garantía:t.warrantyOf!=null?`Del #${t.warrantyOf}`:""})));
  add("Ventas",db.sales.map(s=>({Folio:"V"+s.folio,Fecha:s.date,Hora:s.time,Artículos:s.items.map(i=>`${i.qty} x ${i.name}`).join(", "),"Forma de pago":s.method,Total:s.total,Vendió:s.user||""})));
  add("Pedidos",db.orders.map(o=>({Folio:"P"+o.folio,Fecha:o.date,Cliente:o.name,Teléfono:o.phone,Pedido:itemName(o),Estado:ordSt(o.status).name,Total:o.price,Pagado:paid(o),Proveedor:o.provider||""})));
  add("Movimientos",movementsFor("0000-00-00","9999-12-31").map(x=>({Fecha:x.date,Hora:x.time,Concepto:x.concept,"Forma de pago":x.method,Monto:x.amount})));
  add("Cierres de caja",db.cash.history.map(s=>({Abrió:`${s.date} ${s.time}`,"Quién abrió":s.openedBy,Fondo:s.initial,Cerró:`${s.closedDate} ${s.closedTime}`,"Quién cerró":s.closedBy,"Debía haber":s.expected,Contó:s.counted,Diferencia:s.diff})));
  const buf=X.write(wb,{type:"array",bookType:"xlsx"});
  offerFile(`${shop().name.replace(/\s+/g,"-")}-${today()}.xlsx`,buf);
}

const INTAKE_MARKS=[["estrellada","Pantalla estrellada"],["golpes","Golpes o abolladuras"],["tapa","Tapa rota"],["chip","Trae chip"],["memoria","Trae memoria"],["funda","Trae funda"]];
const POWER={si:"Sí enciende",no:"No enciende",ns:"No se pudo comprobar"};
const CHECKS=[["tactil","Táctil",["tactil","touch"]],["pantalla","Pantalla e imagen",["pantalla","display","imagen","lcd","linea","mancha"]],["camtras","Cámara trasera",["camara"]],["camfront","Cámara frontal",["camara","frontal","selfie"]],["bocina","Bocina",["bocina","sonido","audio","altavoz"]],["auricular","Auricular de llamadas",["auricular","escucha","oye"]],["micro","Micrófono",["micro"]],["carga","Carga",["carga","cargador","puerto","pin","bateria","pila"]],["botones","Botones",["boton","volumen","encendido"]],["senal","Señal y SIM",["senal","red","sim","chip"]],["wifi","Wi-Fi y Bluetooth",["wifi","wi-fi","bluetooth","internet"]],["bio","Face ID o huella",["face","huella","biometr","rostro"]]];
const CHECK_ST={ok:"Funciona",falla:"Falla",np:"No se pudo probar"};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function unreported(t){if(!t.check)return [];const txt=norm((t.fault||"")+" "+(t.notes||""));return CHECKS.filter(([k,,kw])=>t.check.items[k]==="falla"&&!kw.some(w=>txt.includes(w))).map(([,n])=>n);}
function intakeText(t){if(!t.intake)return "";return [POWER[t.intake.power],...INTAKE_MARKS.filter(([k])=>(t.intake.marks||[]).includes(k)).map(([,n])=>n)].filter(Boolean).join(", ");}
const waUnreportedText=t=>`Hola ${niceName(t.name)}, te escribimos de ${shop().name}. Al revisar tu ${t.brand} ${t.model} (folio #${t.folio}) encontramos que también fallan: ${unreported(t).join(", ").toLowerCase()}. Avísanos si quieres que lo revisemos también.`;
function checkSectionHTML(t){

  return `<h2>Revisión del técnico</h2>

    <div class="checks">${CHECKS.map(([k,n])=>`<div class="checkrow"><span>${n}</span><span class="tri" role="group" aria-label="${n}">${Object.entries(CHECK_ST).map(([v,l])=>`<button type="button" data-ck="${k}" data-v="${v}" class="${v}" aria-pressed="${st[k]===v}" ${editable?"":"disabled"}>${l}</button>`).join("")}</span></div>`).join("")}</div>
    ${editable?`<div class="row" style="margin:.6rem 0 1.2rem"><button type="button" class="btn small" id="ck-allok">Todo funciona</button><span class="spacer"></span><button class="btn primary" id="ck-save">Guardar revisión</button></div>`:`<div style="margin-bottom:1.2rem"></div>`}`;
}

function bindCustom(root,px,onAdd){const g=s=>root.querySelector("#"+px+"-c-"+s);g("add").onclick=()=>{const n=g("name").value.trim(),pr=+g("price").value;if(!n||!(pr>0)){toast("Escribe el nombre de la pieza y su precio");return;}onAdd({type:"custom",id:"c"+Date.now(),name:n,price:pr,cost:+g("cost").value||0,ptype:"pieza",pending:true});g("name").value="";g("price").value="";g("cost").value="";};}
function arriveItem(t,k){
  const i=t.items[k]; if(!i||!i.pending)return;
  if(i.type==="product"){const p=db.parts.find(x=>x.id===i.id);if(p){const wasZero=p.stock===0;p.stock+=i.qty;p.reserved+=i.qty;if(wasZero)p.addedAt=today();}}
  delete i.pending;
  const twin=t.items.find(x=>x!==i&&x.type===i.type&&x.id===i.id&&!x.pending); if(twin){twin.qty+=i.qty;t.items.splice(t.items.indexOf(i),1);}
  logEvent(t,`Llegó la pieza: ${i.name}`);
  if(!t.items.some(x=>x.pending)&&t.status==="esperando"){t.status="reparacion";logEvent(t,"Ya llegaron todas las piezas. Cambió el estado a En reparación");toast("Ya llegaron todas las piezas");}
  else toast(`Llegó ${i.name}`);
  save(); openDetail(t.folio); renderTickets();
}

function restockProduct(id){
  const p=db.parts.find(x=>x.id===id); if(!p)return;

function techAddProduct(){

      <div class="error" id="ta-err" role="alert"></div></div>
    <div class="dfoot"><span class="spacer"></span><button class="btn primary" id="ta-ok">Agregar</button></div>`);
  const $=s=>d.querySelector(s), err=$("#ta-err");
  $("#ta-scan").onclick=()=>scanBarcode(c=>{$("#ta-code").value=c;});
  $("#ta-name").focus();
  $("#ta-ok").onclick=()=>{

    if(code){const ex=findByCode(code);if(ex){d.close();toast("Ese producto ya existe: solo resúrtelo");restockProduct(ex.id);return;}}

    if(!Number.isInteger(qty)||qty<1){err.textContent="Escribe cuántas llegaron.";return;}
    db.parts.push({id:"p"+Date.now(),type,name,code,provider:"",cost:0,price:0,stock:qty,reserved:0,addedAt:today(),needsPrice:true,addedBy:currentUser.name});
    (db.stockLog=db.stockLog||[]).push({date:today(),time:nowTime(),user:currentUser.name,product:name,qty,kind:"alta"});
    notify("inventario",`${currentUser.name} dio de alta ${name} (${qty}). Falta ponerle costo y precio.`);
    save(); d.close(); toast("Agregado. El administrador le pondrá precio."); route();
  };
}

/* ---------- Nube (Firebase) ---------- */
function blankDB(){return {next:0,nextSale:0,nextOrder:0,parts:[],services:[],tickets:[],sales:[],orders:[],users:[],cash:{open:null,history:[]},notifs:[],stockLog:[],
  settings:{name:"IGR Reparaciones",phone:"",address:"Valle de Bravo, Estado de México",terms:DEFAULT_TERMS.slice(),orderTerms:DEFAULT_ORDER_TERMS.slice(),
    notif:{entregas:true,cobros:true,gastos:true,cancelaciones:true,garantias:true,cierre:true,otros:false,resumen:true,resumenHora:"20:00",revision:true,inventario:true}},
  v2:true,v3:true,v4:true,v5:true,v6:true,v7:true,v8:true,v9:true};}
const COLS=[["tickets","tickets",x=>"t"+x.folio+"-"+x._k],["orders","pedidos",x=>"p"+x.folio+"-"+x._k],["sales","ventas",x=>"v"+x.folio+"-"+x._k],
  ["parts","inventario",x=>x.id],["services","servicios",x=>x.id],["users","usuarios",x=>x.id],["cierres","cierres",x=>x.id]];
const FOLIO_COLS={tickets:"next",orders:"nextOrder",sales:"nextSale"};
const sync={last:{},meta:null,imgs:new Map(),known:new Set(),loading:new Set(),ready:false,subs:[],denied:false,metaExists:false};
let fbUser=null;
const rnd=()=>Math.random().toString(36).slice(2,8);
const arrOf=k=>k==="cierres"?(db.cash.history=db.cash.history||[]):(db[k]=db[k]||[]);
function hashStr(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36)+s.length.toString(36);}
function dehydrate(v,out){
  if(typeof v==="string"){if(v.length>1500&&v.startsWith("data:")){const id=hashStr(v);if(!sync.imgs.has(id))sync.imgs.set(id,v);if(!sync.known.has(id))out.add(id);return "img:"+id;}return v;}
  if(Array.isArray(v))return v.map(x=>dehydrate(x,out));
  if(v&&typeof v==="object"){const o={};for(const k in v){if(v[k]!==undefined)o[k]=dehydrate(v[k],out);}return o;}
  return v;
}
function hydrate(v,miss){
  if(typeof v==="string"){if(v.startsWith("img:")){const id=v.slice(4);sync.known.add(id);const d=sync.imgs.get(id);if(d)return d;miss.add(id);}return v;}
  if(Array.isArray(v)){for(let i=0;i<v.length;i++)v[i]=hydrate(v[i],miss);return v;}
  if(v&&typeof v==="object"){for(const k in v)v[k]=hydrate(v[k],miss);return v;}
  return v;
}
function replaceInPlace(old,obj){for(const k of Object.keys(old))delete old[k];Object.assign(old,obj);}
function metaOf(){const m={};for(const k in db){if(COLS.some(c=>c[0]===k)||k==="cash")continue;m[k]=db[k];}m.cash={open:db.cash?db.cash.open:null};return m;}

function save(){ if(!sync.ready||!fbUser||!window.FB) return Promise.resolve(); return flush(); }
function flush(){
  const ops=[], newImgs=new Set();
  db.stockLog=(db.stockLog||[]).slice(-500);
  for(const [k,col,key] of COLS){
    const last=sync.last[col]||(sync.last[col]=new Map()), seen=new Set();
    for(const x of arrOf(k)){
      if(FOLIO_COLS[k]&&!x._k)x._k=rnd();
      if(k==="cierres"&&!x.id)x.id="cx"+Date.now()+rnd();
      const id=key(x); seen.add(id);
      const j=JSON.stringify(dehydrate(x,newImgs));
      if(last.get(id)!==j){last.set(id,j);ops.push(["set",col,id,k==="users"?{j,role:x.role}:{j}]);}
    }
    for(const id of [...last.keys()]) if(!seen.has(id)){last.delete(id);ops.push(["del",col,id]);}
  }
  const mj=JSON.stringify(dehydrate(metaOf(),newImgs));
  if(mj!==sync.meta){sync.meta=mj;ops.push(["set","meta","estado",{j:mj}]);sync.metaExists=true;}
  const imgOps=[];
  newImgs.forEach(id=>{const d=sync.imgs.get(id);if(d.length>1000000){toast("Una foto es demasiado grande para subirla a la nube");return;}sync.known.add(id);imgOps.push(["set","imagenes",id,{d}]);});
  return commitOps(imgOps.concat(ops));
}
function commitOps(ops){
  if(!ops.length)return Promise.resolve();
  const chunks=[];let cur=[],size=0;
  for(const op of ops){const s=op[3]?String(op[3].j||op[3].d||"").length:50;if(cur.length&&(cur.length>=400||size+s>7e6)){chunks.push(cur);cur=[];size=0;}cur.push(op);size+=s;}
  if(cur.length)chunks.push(cur);
  return Promise.all(chunks.map(ch=>{const b=FB.writeBatch(FB.fs);ch.forEach(([t,col,id,data])=>{const r=FB.doc(FB.fs,col,id);if(t==="del")b.delete(r);else b.set(r,data);});return b.commit().catch(cloudError);}));
}
function cloudError(e){console.error(e);const c=e&&e.code||"";
  toast(c==="permission-denied"?"No tienes permiso para guardar eso en la nube":c==="resource-exhausted"?"Se llegó al límite gratuito de hoy en la nube":"No se pudo guardar en la nube ("+c+")");}

function applyCol(k,col,key,snap){
  const last=sync.last[col]||(sync.last[col]=new Map()), arr=arrOf(k), miss=new Set(); let changed=false;
  snap.docChanges().forEach(ch=>{
    const id=ch.doc.id;
    if(ch.type==="removed"){if(!last.has(id))return;last.delete(id);const i=arr.findIndex(x=>key(x)===id);if(i>=0)arr.splice(i,1);changed=true;return;}
    const j=ch.doc.data().j; if(typeof j!=="string"||last.get(id)===j)return; last.set(id,j);
    const obj=hydrate(JSON.parse(j),miss), i=arr.findIndex(x=>key(x)===id);
    if(i>=0)replaceInPlace(arr[i],obj); else arr.push(obj); changed=true;
  });
  if(!changed)return;
  if(FOLIO_COLS[k]){arr.sort((a,b)=>a.folio-b.folio);db[FOLIO_COLS[k]]=Math.max(db[FOLIO_COLS[k]]||0,...arr.map(x=>x.folio+1));}
  fetchImgs(miss); remoteChanged();
}
function applyMeta(s){
  if(!s.exists())return; sync.metaExists=true;
  const j=s.data().j; if(j===sync.meta)return; sync.meta=j;
  const miss=new Set(), m=hydrate(JSON.parse(j),miss);
  for(const k in m){
    if(k==="cash"){db.cash.open=m.cash?m.cash.open:null;continue;}
    if(Object.values(FOLIO_COLS).includes(k)){db[k]=Math.max(db[k]||0,m[k]||0);continue;}
    if(db[k]&&m[k]&&typeof db[k]==="object"&&typeof m[k]==="object"&&!Array.isArray(db[k])&&!Array.isArray(m[k]))replaceInPlace(db[k],m[k]); else db[k]=m[k];
  }
  fetchImgs(miss); paintBrand(); remoteChanged();
}
function fetchImgs(ids){ids.forEach(id=>{if(sync.loading.has(id)||sync.imgs.has(id))return;sync.loading.add(id);
  FB.getDoc(FB.doc(FB.fs,"imagenes",id)).then(s=>{if(s.exists()){sync.imgs.set(id,s.data().d);rehydrateAll();}}).catch(()=>{}).finally(()=>sync.loading.delete(id));});}
function rehydrateAll(){clearTimeout(sync.rh);sync.rh=setTimeout(()=>{const m=new Set();COLS.forEach(([k])=>hydrate(arrOf(k),m));hydrate(db.cash,m);remoteChanged(true);},150);}
function remoteChanged(){
  if(!sync.ready||!currentUser)return;
  clearTimeout(sync.rr); sync.rr=setTimeout(()=>{
    const me=db.users.find(x=>x.uid===fbUser.uid);
    if(!me){toast("Tu usuario fue dado de baja");FB.signOut(FB.auth);return;}
    if(me.role!==currentUser.role||me.name!==currentUser.name)setUser(me); else currentUser=me;
    const v=(location.hash||"#inicio").slice(1);
    if(["nuevo","venta","pedido"].includes(v)||document.getElementById("modal").open||document.getElementById("detail").open)return;
    const y=window.scrollY; route(); window.scrollTo(0,y);
  },400);
}
function stopListen(){sync.subs.forEach(u=>{try{u();}catch(e){}});sync.subs=[];}
function listen(){
  let waiting=COLS.length+1; const done=()=>{if(--waiting===0)onFirstLoad();};
  const onErr=first=>e=>{console.error(e);if(e.code==="permission-denied")sync.denied=true;if(first.v){first.v=false;done();}else if(e.code==="permission-denied"&&currentUser){toast("Ya no tienes acceso al sistema");FB.signOut(FB.auth);}};
  COLS.forEach(([k,col,key])=>{const first={v:true};sync.subs.push(FB.onSnapshot(FB.collection(FB.fs,col),snap=>{applyCol(k,col,key,snap);if(first.v){first.v=false;done();}},onErr(first)));});
  const first={v:true};
  sync.subs.push(FB.onSnapshot(FB.doc(FB.fs,"meta","estado"),s=>{applyMeta(s);if(first.v){first.v=false;done();}},onErr(first)));
}
function resetLocal(){db=blankDB();sync.last={};sync.meta=null;sync.ready=false;sync.denied=false;sync.metaExists=false;}

const PER_PAGE=10;
function pageOf(list,page){const pages=Math.max(1,Math.ceil(list.length/PER_PAGE));page=Math.min(Math.max(0,page),pages-1);return {items:list.slice(page*PER_PAGE,(page+1)*PER_PAGE),page,pages,total:list.length};}
function pagerHTML(pg){
  if(pg.pages<=1) return pg.total?`<p class="stockline" style="text-align:center;margin-top:.8rem">${pg.total} en total</p>`:"";
  const from=pg.page*PER_PAGE+1, to=Math.min(pg.total,(pg.page+1)*PER_PAGE), nums=[];
  for(let i=0;i<pg.pages;i++){ if(i===0||i===pg.pages-1||Math.abs(i-pg.page)<=1) nums.push(i); else if(nums[nums.length-1]!=="…") nums.push("…"); }
  return `<nav class="pager" aria-label="Páginas">
    <button class="btn small" data-pg="${pg.page-1}" ${pg.page===0?"disabled":""}>Anterior</button>
    ${nums.map(i=>i==="…"?`<span class="stockline">…</span>`:`<button class="btn small pg" data-pg="${i}" ${i===pg.page?'aria-current="page"':""}>${i+1}</button>`).join("")}
    <button class="btn small" data-pg="${pg.page+1}" ${pg.page>=pg.pages-1?"disabled":""}>Siguiente</button>
    <span class="stockline" style="width:100%;text-align:center">${from} a ${to} de ${pg.total}</span></nav>`;
}

function countFor(id){ if(id==="todos") return db.tickets.length; if(id==="activos") return db.tickets.filter(t=>!["entregado","cancelado"].includes(t.status)).length; return db.tickets.filter(t=>t.status===id).length; }

/* ---------- Cuadros de piezas, servicios y accesorios ---------- */
function pickersHTML(){
  return [["pieza","Piezas","var(--info)"],["servicio","Servicios","var(--ok)"],["accesorio","Accesorios","var(--violet)"]].map(([k,n,c])=>`
    <div class="picker" style="--dot:${c}">
      <h3>${n}</h3>
      <div class="row" style="gap:.4rem;flex-wrap:nowrap"><input class="search" data-q="${k}" type="search" placeholder="${k==="servicio"?"Buscar servicio":"Buscar o escanear"}" autocomplete="off" aria-label="Buscar ${n.toLowerCase()}">${k!=="servicio"?`<button type="button" class="btn small" data-scan="${k}" aria-label="Escanear ${n.toLowerCase()} con la cámara">Cámara</button>`:""}</div>
      <div class="plist" data-list="${k}"></div>
    </div>`).join("");
}
function mountPickers(root,{inUse,onAdd,allowOut}){
  const boxItems=(k,s)=>{
    s=(s||"").trim().toLowerCase();
    if(k==="servicio") return db.services.filter(x=>!s||x.name.toLowerCase().includes(s)).map(x=>({type:"service",id:x.id,name:x.name,price:x.price,sub:"Servicio",dis:false}));
    return db.parts.filter(p=>p.type===k&&(!s||p.name.toLowerCase().includes(s)||(p.code||"").toLowerCase().includes(s))).map(p=>{const left=avail(p)-inUse(p.id);return {type:"product",id:p.id,name:p.name,price:p.price,sub:p.needsPrice?"Falta precio, avisa al administrador":(p.code?p.code+", ":"")+(left>0?left+" disponibles":allowOut?"sin existencia, se pedirá":"sin existencia"),dis:!!p.needsPrice||(!allowOut&&left<=0)};});
  };
  function paintBox(k){
    const s=root.querySelector(`[data-q="${k}"]`).value, l=boxItems(k,s), el=root.querySelector(`[data-list="${k}"]`);
    el.innerHTML=l.length?l.map(x=>`<button type="button" class="pitem" data-it="${x.type}:${x.id}" ${x.dis?"disabled":""}><span class="pi-text"><span class="r-name">${esc(x.name)}</span><span class="code">${esc(x.sub)}</span></span><span class="r-price">${money(x.price)}</span><span class="plus" aria-hidden="true">+</span></button>`).join("")
      :`<p class="stockline" style="margin:.5rem .2rem">${s?`Nada coincide con “${esc(s)}”.`:"Todavía no hay registrados en el inventario."}</p>`;
    el.querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{const [ty,id]=b.dataset.it.split(":");onAdd(ty,id);});
  }
  const refresh=()=>["pieza","servicio","accesorio"].forEach(paintBox);
  root.querySelectorAll("[data-q]").forEach(inp=>{
    const k=inp.dataset.q;
    inp.oninput=()=>paintBox(k);
    inp.onkeydown=e=>{
      if(e.key!=="Enter")return; e.preventDefault();
      const s=inp.value.trim(); if(!s)return;
      const p=k!=="servicio"?findByCode(s):null;
      if(p){ if(onAdd("product",p.id)){inp.value="";paintBox(k);} return; }
      const l=boxItems(k,s).filter(x=>!x.dis);
      if(l.length===1){ if(onAdd(l[0].type,l[0].id)){inp.value="";paintBox(k);} }
      else toast(l.length?"Hay varias opciones, toca la que quieras":`No encontré “${s}”`);
    };
  });
  root.querySelectorAll("[data-scan]").forEach(b=>b.onclick=()=>scanBarcode(code=>{const p=findByCode(code);if(!p){toast(`El código ${code} no está registrado`);return;}if(onAdd("product",p.id))toast(`Agregado: ${p.name}`);}));
  refresh();
  return {refresh};
}
function openAddItems(t){
  const d=modal(`<div class="dhead"><b>Agregar al ticket #${t.folio}</b><span class="spacer"></span><button class="btn small" data-close>Listo</button></div>
    <div class="dbody"><div class="pickers">${pickersHTML()}</div>${customHTML("a")}
    <p class="stockline" style="margin:.8rem 0 0">Toca lo que quieras agregar. Si no hay existencia, se agrega como pieza por pedir y el ticket pasa a “Esperando pieza”.</p></div>`);
  d.classList.add("wide");
  let pk;
  const after=it=>{
    const ex=t.items.find(i=>i.type===it.type&&i.id===it.id&&!!i.pending===!!it.pending); if(ex)ex.qty++; else t.items.push({...it,qty:1});
    t.price=t.items.reduce((a,i)=>a+i.price*i.qty,0);
    logEvent(t,`Agregó ${it.name} (${money(it.price)})${it.pending?", por pedir":""}`);
    if(it.pending&&["recibido","diagnostico","reparacion","listo"].includes(t.status)){t.status="esperando";logEvent(t,"Cambió el estado a Esperando pieza");}
    save(); toast(it.pending?`${it.name}: se agregó por pedir`:`Agregado: ${it.name}`); if(pk)pk.refresh(); openDetail(t.folio); renderTickets(); return true;
  };
  pk=mountPickers(d.querySelector(".pickers"),{inUse:()=>0,allowOut:true,onAdd:(type,id)=>{
    if(type==="product"){const p=db.parts.find(x=>x.id===id);if(!p)return false;const pend=avail(p)<1;if(!pend)p.reserved+=1;return after({type,id,name:p.name,price:t.warrantyOf!=null?0:p.price,cost:p.cost||0,ptype:p.type,...(pend?{pending:true}:{})});}
    const s=db.services.find(x=>x.id===id);if(!s)return false;return after({type,id,name:s.name,price:t.warrantyOf!=null?0:s.price,cost:0});
  }});
  bindCustom(d,"a",it=>{if(t.warrantyOf!=null)it.price=0;after(it);});
}

  }
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{draft.pay=b.dataset.p;renderPay();});
  renderPay();

  setupSignature();
  document.getElementById("saveTicket").onclick=saveTicket;
}

let sigCanvas, sigCtx;
function setupSignature(){
  sigCanvas=document.getElementById("sig"); sigCtx=sigCanvas.getContext("2d");
  const fit=()=>{const r=sigCanvas.getBoundingClientRect();const d=window.devicePixelRatio||1;sigCanvas.width=r.width*d;sigCanvas.height=r.height*d;sigCtx.scale(d,d);sigCtx.lineWidth=2.4;sigCtx.lineCap="round";sigCtx.strokeStyle="#111";draft.signed=false;};
  fit();
  let drawing=false;
  const pt=e=>{const r=sigCanvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  sigCanvas.onpointerdown=e=>{drawing=true;sigCanvas.setPointerCapture(e.pointerId);const [x,y]=pt(e);sigCtx.beginPath();sigCtx.moveTo(x,y);};
  sigCanvas.onpointermove=e=>{if(!drawing)return;const [x,y]=pt(e);sigCtx.lineTo(x,y);sigCtx.stroke();draft.signed=true;};
  sigCanvas.onpointerup=sigCanvas.onpointercancel=()=>drawing=false;
  document.getElementById("clearSig").onclick=fit;
}

function saveTicket(){
  const v=id=>document.getElementById(id).value.trim();
  const err=document.getElementById("err");
  const missing=[];
  if(!v("f-name")) missing.push("nombre"); if(!v("f-phone")) missing.push("teléfono");
  if(!v("f-brand")) missing.push("marca"); if(!v("f-model")) missing.push("modelo");
  if(!v("f-fault")) missing.push("falla"); if(!draft.power) missing.push("si el equipo enciende");
  if(!draft.items.length&&draft.warrantyOf==null) missing.push("al menos una pieza o servicio");
  if(!document.getElementById("f-accept").checked) missing.push("aceptación de términos");
  if(!draft.signed) missing.push("firma del cliente");
  let lockValue="";
  if(draft.lock==="pattern"){ if(draft.pattern.length<4) missing.push("patrón (mínimo 4 puntos)"); else lockValue=draft.pattern.join("-"); }
  if(draft.lock==="pin"){ lockValue=v("f-pin"); if(!lockValue) missing.push("PIN"); }
  if(draft.lock==="password"){ lockValue=document.getElementById("f-pass").value; if(!lockValue) missing.push("contraseña"); }
  let payments=[];
  const total=draft.price||0, pre=draft.prePaid||0;
  if(draft.pay==="partial"){
    const a=draft.advance||0;
    if(!(a>0)) missing.push("cantidad del anticipo");
    else if(total>0 && a+pre>=total){ err.textContent="El anticipo cubre el total. Marca “Pagó todo”."; return; }
    else payments=[{amount:a,method:draft.method,...stamp()}];
  }
  if((draft.pay==="partial"||draft.pay==="full")&&!cashOpen()){ err.textContent="La caja está cerrada: marca “No dejó nada” o pide que abran la caja."; return; }
  if(draft.pay==="full" && total-pre>0) payments=[{amount:total-pre,method:draft.method,...stamp()}];
  if(missing.length){err.textContent="Falta: "+missing.join(", ")+".";return;}
  const fromO = draft.fromOrder!=null ? db.orders.find(x=>x.folio===draft.fromOrder) : null;
  const held = id => fromO&&fromO.status==="llego" ? fromO.items.filter(i=>i.type==="product"&&i.id===id).reduce((a,i)=>a+i.qty,0) : 0;
  for(const i of draft.items){ if(i.type==="product"&&!i.pending){ const p=db.parts.find(x=>x.id===i.id); if(!p||avail(p)+held(i.id)<i.qty){ err.textContent=`Ya no hay suficiente existencia de ${i.name}.`; return; } } }
  if(fromO&&fromO.status==="llego") fromO.items.forEach(i=>{ if(i.type==="product"){ const p=db.parts.find(x=>x.id===i.id); if(p) p.reserved=Math.max(0,p.reserved-i.qty); } });
  draft.items.forEach(i=>{ if(i.type==="product"&&!i.pending) db.parts.find(x=>x.id===i.id).reserved+=i.qty; });
  if(fromO) payments=[...fromO.payments.map(p=>({...p})),...payments];
  const t={folio:db.next++, date:today(), name:v("f-name").toUpperCase(), phone:v("f-phone"), brand:v("f-brand").toUpperCase(), model:v("f-model").toUpperCase(), color:v("f-color"), fault:v("f-fault"), notes:v("f-notes"), items:draft.items.map(({type,id,name,price,cost,qty,ptype,pending})=>({type,id,name,price,cost,qty,ptype,...(pending?{pending:true}:{})})), price:draft.price, status:draft.items.some(i=>i.pending)?"esperando":"recibido", photos:draft.photos, signature:sigCanvas.toDataURL("image/png"), stockUsed:false, lockType:draft.lock, lockValue, payments, intake:{power:draft.power,marks:[...document.querySelectorAll("[data-mk]:checked")].map(x=>x.dataset.mk)}, tampered:!!(document.getElementById("f-tampered")||{}).checked, warrantyOf:draft.warrantyOf!=null?draft.warrantyOf:null, createdBy:currentUser.name, log:[{kind:"sistema",text:draft.warrantyOf!=null?`Ticket de garantía del #${draft.warrantyOf}`:"Ticket creado",date:today(),time:nowTime(),user:currentUser.name}]};
  if(draft.warrantyOf!=null){ const ow=db.tickets.find(x=>x.folio===draft.warrantyOf); if(ow) logEvent(ow,`Se abrió el ticket de garantía #${t.folio}`); }
  if(fromO){ fromO.status="convertido"; fromO.ticket=t.folio; logEvent(fromO,`Pasó al ticket de reparación #${t.folio}`); t.fromOrder=fromO.folio; t.log.push({kind:"sistema",text:`Viene del pedido P${fromO.folio}`,date:today(),time:nowTime(),user:currentUser.name}); }
  const fresh=draft.pay==="partial"?(draft.advance||0):draft.pay==="full"?Math.max(0,total-pre):0;
  if(fresh>0) notify("cobros",`${currentUser.name} cobró ${money(fresh)} en ${draft.method.toLowerCase()} al recibir el ticket #${t.folio}`);
  if(draft.warrantyOf!=null) notify("garantias",`${currentUser.name} abrió el ticket de garantía #${t.folio} del #${draft.warrantyOf} (${t.brand} ${t.model})`);
  { const pend=t.items.filter(i=>i.pending); if(pend.length) t.log.push({kind:"sistema",text:`Esperando pieza: ${pend.map(i=>i.name).join(", ")}`,date:today(),time:nowTime(),user:currentUser.name}); }
  db.tickets.push(t); save();
  toast(`Ticket #${t.folio} guardado. Imprimiendo tickets…`);
  location.hash="inicio"; setTimeout(()=>{openDetail(t.folio);printBoth(t);},80);
}

function changeStatus(t,to){
  if(to===t.status) return;
  if(["listo","entregado"].includes(to)&&(t.items||[]).some(i=>i.pending)){toast("Todavía falta que llegue una pieza");return;}
  const prods=(t.items||[]).filter(i=>i.type==="product"&&!i.pending).map(i=>[db.parts.find(p=>p.id===i.id),i.qty]).filter(([p])=>p);
  // Deshacer el estado anterior: descontado, apartado o liberado
  prods.forEach(([p,q])=>{ if(t.stockUsed) p.stock+=q; else if(t.status!=="cancelado") p.reserved=Math.max(0,p.reserved-q); });
  // Aplicar el nuevo: se descuenta al entregar, se libera al cancelar, si no queda apartado
  prods.forEach(([p,q])=>{ if(to==="entregado") p.stock=Math.max(0,p.stock-q); else if(to!=="cancelado") p.reserved+=q; });
  t.stockUsed = to==="entregado";
  if(to==="entregado") t.deliveredAt=today(); else delete t.deliveredAt;
  t.status=to; logEvent(t,`Cambió el estado a ${stOf(to).name}`);
  if(to==="entregado") notify("entregas",`${currentUser.name} entregó el ticket #${t.folio} (${t.brand} ${t.model}) a ${t.name}`);
  if(to==="cancelado") notify("cancelaciones",`${currentUser.name} canceló el ticket #${t.folio} de ${t.name}`);
  save();
  toast(to==="entregado"&&balance(t)>0 ? `Entregado, pero resta ${money(balance(t))} por cobrar` : `#${t.folio}: ${stOf(to).name}`);
}

const TYPES={pieza:"Pieza",accesorio:"Accesorio",servicio:"Servicio"};
const avail=p=>p.stock-(p.reserved||0);
let isAdmin=false, currentUser=null;
function findByCode(code){code=String(code||"").trim();return code?db.parts.find(p=>p.code===code):null;}
function matchProducts(q,type){q=String(q||"").trim().toLowerCase();return db.parts.filter(p=>(!type||type==="todos"||p.type===type)&&(!q||p.name.toLowerCase().includes(q)||(p.code||"").toLowerCase().includes(q)));}
function modal(html){const d=document.getElementById("modal");d.className="";d.onclose=null;d.innerHTML=html;d.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>d.close());if(!d.open)d.showModal();return d;}
function twoStep(btn,label,fn){btn.onclick=()=>{if(btn.dataset.armed){fn();return;}btn.dataset.armed="1";const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=old;}},3500);};}

  const load=u=>{editing=u;$("#uf-title").textContent=u?`Editar a ${u.name}`:"Agregar usuario";$("#uf-name").value=u?u.name:"";$("#uf-role").value=u?u.role:"tecnico";
    $("#uf-email").value="";$("#uf-pass").value="";$("#uf-emailL").hidden=!!u;$("#uf-passL").hidden=!!u;

    $("#uf-save").textContent=u?"Guardar cambios":"Agregar usuario";$("#uf-del").hidden=!u||u.id===currentUser.id;$("#uf-reset").hidden=!u||!u.email;$("#uf-new").hidden=!u;$("#uf-err").textContent="";$("#uf-name").focus();};
  d.querySelectorAll("[data-eu]").forEach(b=>b.onclick=()=>load(db.users.find(x=>x.id===b.dataset.eu)));

}

/* ---------- Escáner por cámara ---------- */

async function scanBarcode(onCode){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Este navegador no permite usar la cámara. Usa el lector de códigos.");return;}
  const hasDetector="BarcodeDetector" in window, hasZX=!!window.ZXing;
  if(!hasDetector&&!hasZX){toast("No se pudo cargar el escáner por cámara. Usa el lector de códigos.");return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});}
  catch(e){toast("No se pudo abrir la cámara. Revisa el permiso del navegador.");return;}
  const d=document.getElementById("cam");let finished=false,reader=null;
  d.innerHTML=`<div class="dhead"><b>Escanear código de barras</b><span class="spacer"></span><button class="btn small" id="scClose">Cancelar</button></div>
    <div class="scanview"><video id="scV" autoplay playsinline muted></video><div class="scanframe"></div></div>
    <div class="dfoot"><span class="stockline">Acerca el código al recuadro y mantenlo quieto.</span></div>`;
  const v=d.querySelector("#scV");v.srcObject=stream;
  const stop=()=>{finished=true;try{reader&&reader.reset();}catch(e){}stream.getTracks().forEach(t=>t.stop());};
  const done=code=>{if(finished)return;stop();d.close();if(navigator.vibrate)navigator.vibrate(60);onCode(String(code).trim());};
  d.querySelector("#scClose").onclick=()=>d.close();
  d.onclose=stop;
  d.showModal();
  let det=null; if(hasDetector){try{det=new BarcodeDetector();}catch(e){det=null;}}
  if(det){const tick=async()=>{if(finished)return;try{if(v.readyState>=2){const r=await det.detect(v);if(r.length){done(r[0].rawValue);return;}}}catch(e){}setTimeout(tick,150);};tick();return;}
  if(hasZX){reader=new ZXing.BrowserMultiFormatReader();try{reader.decodeFromStream(stream,v,res=>{if(res)done(res.getText());});}catch(e){toast("No se pudo iniciar el escáner.");}}
}
